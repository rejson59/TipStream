name: Build and publish GiftStream for Windows

on:
  push:
    tags:
      - "v*"

env:
  RELEASE_TAG: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Sprawdź tag wydania
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Użyj taga w formacie vX.Y.Z, np. v0.5.0"
          }

      - name: Sprawdź wersję aplikacji
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $expected = 'VERSION = "' + $version + '"'
          if (-not (Select-String -Path app/version.py -SimpleMatch -Pattern $expected)) {
            throw "Tag wydania i VERSION w app/version.py muszą być zgodne."
          }

      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Zainstaluj zależności, testy i PyInstaller
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller pytest

      - name: Uruchom testy
        run: python -m pytest -q

      - name: Zbuduj pojedynczą aplikację GiftStream
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name GiftStream
          --icon assets/giftstream.ico
          --paths .
          --add-data "web;web"
          --add-data "docs;docs"
          --add-data "100-levels-5229-v1.7.4.zip;."
          --collect-all webview
          --collect-all proxy_tools
          --collect-all bottle
          --collect-all pythonnet
          --collect-all clr_loader
          --hidden-import webview.platforms.edgechromium
          --hidden-import webview.platforms.winforms
          --hidden-import clr
          --collect-all TikTokLive
          --collect-all TikTokLiveProto
          --collect-all websockets_proxy
          --collect-all EulerApiSdk
          app/desktop.py

      - name: Przygotuj plik aplikacji i sumę SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist/GiftStream.exe release-assets/GiftStream.exe
          $hash = (Get-FileHash release-assets/GiftStream.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GiftStream.exe" | Set-Content -Encoding ascii release-assets/checksums.txt
          Compress-Archive -Path browser-extension\* -DestinationPath release-assets\GiftStream-Browser-Relay.zip -Force
          $extensionHash = (Get-FileHash release-assets/GiftStream-Browser-Relay.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$extensionHash  GiftStream-Browser-Relay.zip" | Add-Content -Encoding ascii release-assets/checksums.txt
          Get-ChildItem release-assets | Select-Object Name,Length

      - name: Opublikuj wydanie GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              --repo $env:GITHUB_REPOSITORY `
              --clobber `
              release-assets/GiftStream.exe `
              release-assets/checksums.txt `
              release-assets/GiftStream-Browser-Relay.zip
          } else {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "GiftStream $tag" `
              --target $env:GITHUB_SHA `
              --generate-notes `
              release-assets/GiftStream.exe `
              release-assets/checksums.txt `
              release-assets/GiftStream-Browser-Relay.zip
          }
